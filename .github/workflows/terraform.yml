name: Terraform

on:
  push:
    branches: ["main"]
    pull_request:

    permission:
      contents: read

    jobs:
      terraform:
        name: "Terraform"
        runs-on: self-hosted

        #Use the bash shell reegardless whether the Github Actions runner is ubuntu-lates, macos-lates, or windows-lates
        defaults:
          run:
            shell: bash

        steps:
        # Checkout the repository to the GitHub Actionsrunner
        - name: Checkout
          uses: actions/checkout@v4

        #Install the lates version of Terraform CLI and configure the terraform CLI configuration file with a terraform Cloud user API token
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v1
          with:
            cli_config_credentioals_token: ${{ secrets.TF_API_TOKEN }}

        #Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
        - name: Terraform Format
          run: terraform-fmt -check
          env:
            GOOGLE_CREDENTIALS: ${{secrets.GCP_SA_KEY}}

          #Generate an execution plan for Terraform
          - name: Terraform Plan
            run: terraform plan -input=false
            env: 
              GOOGLE_CREDENTIALS: ${{secrets.GCP_SA_KEY}}


          
